syntax = "proto3";

package prescription;

option java_multiple_files = true;
option java_package = "com.aarogya.prescription.grpc";
option java_outer_classname = "PrescriptionProto";

service PrescriptionService {
  rpc GetPrescriptionStats(PrescriptionStatsRequest) returns (PrescriptionStatsResponse);
}

message PrescriptionStatsRequest {
  string doctorId = 1;
}

message TopMedicine {
  string medicineId = 1;
  string medicineName = 2;
  int64 count = 3;
}

message FavoriteTemplateUsage {
  string templateId = 1;
  string templateName = 2;
  int64 usageCount = 3;
}

message PrescriptionGrowth {
  int32 year = 1;
  int32 month = 2;
  int64 totalPrescriptions = 3;
}

message PrescriptionStatsResponse {
  int64 totalPrescriptionsIssued = 1;
  repeated TopMedicine topMedicines = 2;
  repeated FavoriteTemplateUsage favoriteTemplatesUsed = 3;
  double avgMedicinesPerPrescription = 4;
  double templateModificationRatio = 5;
  repeated PrescriptionGrowth prescriptionGrowthTrend = 6;
}
