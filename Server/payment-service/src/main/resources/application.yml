spring:
  application:
    name: payment-service
  kafka:
    bootstrap-servers: ${KAFKA_BROKER_URL}
  data:
    mongodb:
      host: localhost
      port: 27017
      username: admin
      password: password
      database: aarogyadb
      authentication-database: admin
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

server:
  port: ${PAYMENT_SERVICE_PORT}
  servlet:
    context-path: /payment

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL}

grpc:
  server:
    port: ${GRPC_PORT}

deploy:
  env: ${DEPLOY_ENV}

logging:
  level:
    com.aarogya.payment_service: DEBUG
    org.springframework.data.mongodb: INFO
    com.razorpay: INFO

razorpay:
  key:
    id: ${RAZORPAY_KEY_ID}
    secret: ${RAZORPAY_KEY_SECRET}
  webhook:
    secret: ${RAZORPAY_WEBHOOK_SECRET}