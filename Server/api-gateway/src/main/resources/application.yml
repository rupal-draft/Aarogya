spring.application.name: ${SPRING_APPLICATION_NAME}
eureka.client.service-url.defaultZone: ${EUREKA_SERVER_URL}
server.port: ${SERVER_PORT}
cors:
  origin: ${FRONTEND_URL}

jwt:
  secretKey: ${JWT_SECRET_KEY}


logging:
  level:
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG
    org.springframework.cloud.gateway.filter.factory: DEBUG
    reactor.netty.http.client: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: DEBUG


spring:
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

        - id: article-service
          uri: lb://ARTICLE-SERVICE
          predicates:
            - Path=/api/v1/article/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: pharmacy-service
          uri: lb://PHARMACY-SERVICE
          predicates:
            - Path=/api/v1/pharmacy/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/api/v1/appointment/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: prescription-service
          uri: lb://PRESCRIPTION-SERVICE
          predicates:
            - Path=/api/v1/prescription/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notification/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: email-service
          uri: lb://EMAIL-SERVICE
          predicates:
            - Path=/api/v1/email/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: doctor-service
          uri: lb://DOCTOR-SERVICE
          predicates:
            - Path=/api/v1/doctors/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: lab-service
          uri: lb://LAB-SERVICE
          predicates:
            - Path=/api/v1/lab/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: patient-management-service
          uri: lb://PATIENT-MANAGEMENT-SERVICE
          predicates:
            - Path=/api/v1/patient/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/v1/payment/**
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter
